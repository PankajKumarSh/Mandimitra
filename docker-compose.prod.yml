# Single-server production example (one VM). For larger setups use a managed Postgres and run the
# api / worker / web containers on your platform of choice — see docs/DEPLOYMENT.md.
#
#   cp .env.example .env.production   # fill in real secrets (never commit)
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Put a TLS-terminating proxy (Caddy / nginx / Cloudflare) in front of `web` on port 3000.

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  APP_URL: ${APP_URL}
  WEB_ORIGIN: ${APP_URL}
  TRUST_PROXY: "1"
  JOBS_MODE: worker
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  BILLING_PROVIDER: razorpay
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  UPLOAD_DIR: /data/uploads
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: migrate }
    environment: { DATABASE_URL: "${DATABASE_URL}" }
    profiles: ["tools"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    restart: unless-stopped
    environment: *api-env
    volumes: ["uploads:/data/uploads"] # used only when STORAGE_DRIVER=local

  worker:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment: *api-env
    volumes: ["uploads:/data/uploads"]
    healthcheck: { disable: true }

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { API_ORIGIN: "http://api:4000", APP_URL: "${APP_URL}" }
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

volumes:
  uploads:

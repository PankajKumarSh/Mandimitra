name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      # Backend tests boot their own throwaway PostgreSQL 17 (embedded-postgres) — no service needed.
      - run: npm test
      - run: npm run build -w @mandimitra/backend
      - run: npm run build:web
      - run: npm audit --omit=dev --audit-level=high
